[pytest]
# Configuração do pytest para Calculadora

# Diretório de testes
testpaths = tests

# Padrão de descoberta de testes
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Marcadores customizados (opcional)
markers =
    unit: testes unitários de lógica
    integration: testes de integração UI + Backend
    ui: testes de interface
    slow: testes lentos

# Cobertura de código
[coverage:run]
source = src
omit = 
    */tests/*
    */setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
