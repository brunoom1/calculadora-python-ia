name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: windows-latest
        
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install CMake
              run: choco install cmake -y

            - name: Verify CMake installation
              run: cmake --version

            - name: Setup MSVC
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Download Google Test
              run: |
                  cd app
                  if (-not (Test-Path "external")) {
                      mkdir external
                  }
                  cd external
                  git clone --depth 1 --branch release-1.14.0 https://github.com/google/googletest.git

            - name: Build Google Test
              run: |
                  cd app/external/googletest
                  mkdir build
                  cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Release
                  cmake --build . --config Release

            - name: Create build directory
              run: mkdir -p build
              shell: bash

            - name: Configure CMake
              run: |
                  cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Debug -DGTEST_ROOT=app/external/googletest/build

            - name: Build project
              run: |
                  cd build
                  cmake --build . --config Debug
